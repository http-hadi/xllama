name: warp-probe
on:
  push:
    branches: ['probe/**']
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Download third-party D3D12 llama.cpp build
        shell: pwsh
        run: |
          curl.exe -L -o llama-d3d12.zip https://github.com/koza-coder/llama.cpp-directx12/releases/download/v0.2.7/llama-d3d12-v0.2.7-win-x64.zip
          Expand-Archive llama-d3d12.zip -DestinationPath d3d12
          Get-ChildItem d3d12 -Recurse | Select-Object -First 40 FullName,Length | Format-Table -AutoSize
      - name: Adapters + caps (WARP)
        shell: pwsh
        continue-on-error: true
        env:
          GGML_D3D12_WARP: "1"
          GGML_D3D12_DEBUG: "1"
        run: |
          $d = (Get-ChildItem d3d12 -Recurse -Filter test-backend-ops.exe | Select-Object -First 1).DirectoryName
          cd $d
          ./llama-bench.exe --list-devices 2>&1 | Out-String
      - name: test-backend-ops GATED_DELTA_NET / SSM_CONV / ROPE
        shell: pwsh
        continue-on-error: true
        env:
          GGML_D3D12_WARP: "1"
        run: |
          $d = (Get-ChildItem d3d12 -Recurse -Filter test-backend-ops.exe | Select-Object -First 1).DirectoryName
          cd $d
          foreach ($op in "GATED_DELTA_NET","SSM_CONV","ROPE","RMS_NORM","SOLVE_TRI","FLASH_ATTN_EXT") {
            Write-Host "=== $op"
            $p = Start-Process -FilePath ./test-backend-ops.exe -ArgumentList "test","-b","D3D120","-o",$op -NoNewWindow -PassThru -RedirectStandardOutput "out_$op.txt" -RedirectStandardError "err_$op.txt"
            if (-not $p.WaitForExit(240000)) { $p.Kill(); Write-Host "TIMEOUT $op" }
            Get-Content "out_$op.txt" -Tail 6
            Get-Content "err_$op.txt" -Tail 4
          }
      - name: test-backend-ops MUL_MAT q1_0
        shell: pwsh
        continue-on-error: true
        env:
          GGML_D3D12_WARP: "1"
        run: |
          $d = (Get-ChildItem d3d12 -Recurse -Filter test-backend-ops.exe | Select-Object -First 1).DirectoryName
          cd $d
          $p = Start-Process -FilePath ./test-backend-ops.exe -ArgumentList "test","-b","D3D120","-o","MUL_MAT","-p","q1_0" -NoNewWindow -PassThru -RedirectStandardOutput out_q10.txt -RedirectStandardError err_q10.txt
          if (-not $p.WaitForExit(600000)) { $p.Kill(); Write-Host "TIMEOUT" }
          Get-Content out_q10.txt -Tail 25
          Get-Content err_q10.txt -Tail 10
      - name: Shader cache produced?
        shell: pwsh
        continue-on-error: true
        run: |
          $d = (Get-ChildItem d3d12 -Recurse -Filter test-backend-ops.exe | Select-Object -First 1).DirectoryName
          $c = Join-Path $d "d3d12-shader-cache"
          if (Test-Path $c) { $f = Get-ChildItem $c; "files=$($f.Count) bytes=$(($f | Measure-Object Length -Sum).Sum)" } else { "no cache dir" }

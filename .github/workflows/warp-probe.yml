name: warp-probe
on:
  push:
    branches: ['probe/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Download third-party D3D12 llama.cpp build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          curl.exe -sL -o llama-d3d12.zip https://github.com/koza-coder/llama.cpp-directx12/releases/download/v0.2.7/llama-d3d12-v0.2.7-win-x64.zip
          Expand-Archive llama-d3d12.zip -DestinationPath d3d12
          Get-ChildItem d3d12 -Recurse -File | ForEach-Object { "$($_.FullName.Replace($PWD.Path,'')) $($_.Length)" } | Tee-Object logs/files.txt
          $d = (Get-ChildItem d3d12 -Recurse -Filter test-backend-ops.exe | Select-Object -First 1).DirectoryName
          "TOOLDIR=$d" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion | Out-String | Tee-Object logs/video.txt
          (Get-CimInstance Win32_OperatingSystem).Version | Tee-Object logs/os.txt
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores | Out-String | Tee-Object logs/cpu.txt
      - name: Adapters + caps (WARP)
        shell: pwsh
        continue-on-error: true
        env:
          GGML_D3D12_WARP: "1"
          GGML_D3D12_DEBUG: "1"
        run: |
          cd $env:TOOLDIR
          $p = Start-Process -FilePath ./llama-bench.exe -ArgumentList "--list-devices" -NoNewWindow -PassThru -RedirectStandardOutput "$env:GITHUB_WORKSPACE/logs/list_out.txt" -RedirectStandardError "$env:GITHUB_WORKSPACE/logs/list_err.txt"
          if (-not $p.WaitForExit(120000)) { $p.Kill(); "TIMEOUT" | Out-File "$env:GITHUB_WORKSPACE/logs/list_timeout.txt" }
      - name: test-backend-ops (small op set, WARP)
        shell: pwsh
        continue-on-error: true
        env:
          GGML_D3D12_WARP: "1"
        run: |
          cd $env:TOOLDIR
          foreach ($op in "SSM_CONV","GATED_DELTA_NET","RMS_NORM","ROPE") {
            $o = "$env:GITHUB_WORKSPACE/logs/op_$op.out.txt"; $e = "$env:GITHUB_WORKSPACE/logs/op_$op.err.txt"
            $p = Start-Process -FilePath ./test-backend-ops.exe -ArgumentList "test","-b","D3D120","-o",$op -NoNewWindow -PassThru -RedirectStandardOutput $o -RedirectStandardError $e
            if (-not $p.WaitForExit(150000)) { $p.Kill(); "TIMEOUT $op" | Out-File -Append "$env:GITHUB_WORKSPACE/logs/timeouts.txt" }
          }
      - name: MUL_MAT q1_0 / q4_0 (WARP)
        shell: pwsh
        continue-on-error: true
        env:
          GGML_D3D12_WARP: "1"
        run: |
          cd $env:TOOLDIR
          foreach ($t in "q1_0","q4_0") {
            $o = "$env:GITHUB_WORKSPACE/logs/mm_$t.out.txt"; $e = "$env:GITHUB_WORKSPACE/logs/mm_$t.err.txt"
            $p = Start-Process -FilePath ./test-backend-ops.exe -ArgumentList "test","-b","D3D120","-o","MUL_MAT","-p","type_a=$t" -NoNewWindow -PassThru -RedirectStandardOutput $o -RedirectStandardError $e
            if (-not $p.WaitForExit(300000)) { $p.Kill(); "TIMEOUT mm_$t" | Out-File -Append "$env:GITHUB_WORKSPACE/logs/timeouts.txt" }
          }
      - name: Shader cache
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $c = Join-Path $env:TOOLDIR "d3d12-shader-cache"
          if (Test-Path $c) { $f = Get-ChildItem $c; "files=$($f.Count) bytes=$(($f | Measure-Object Length -Sum).Sum)" | Tee-Object logs/cache.txt } else { "no cache dir" | Tee-Object logs/cache.txt }
      - name: Publish logs to branch
        if: always()
        shell: bash
        run: |
          cd logs
          for f in *.txt; do tail -c 20000 "$f" > "$f.tail" 2>/dev/null && mv "$f.tail" "$f"; done
          git init -q . && git checkout -q -b ci-logs-probe
          git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -q -m "probe logs ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-probe
